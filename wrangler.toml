name = "festa-luiza-gate"
main = "worker/src/index.js"
compatibility_date = "2026-05-30"

routes = [
  { pattern = "claudiocode.dev/festa-luiza/*", zone_name = "claudiocode.dev" }
]

[[kv_namespaces]]
binding = "FESTA_LUIZA_KV"
id = "cb7b0d77e7c24d24b9083fbaa4aecb01"

[vars]
UPSTREAM_ORIGIN = "https://claudiovestevao.github.io"
UPSTREAM_BASE_PATH = "/festa-luiza"
SESSION_TTL_SECONDS = "604800"
OTP_TTL_SECONDS = "600"
WHATSAPP_TEMPLATE_NAME = "festa_luiza_codigo"
WHATSAPP_TEMPLATE_LANGUAGE = "pt_BR"
